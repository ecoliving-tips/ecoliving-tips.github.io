name: Daily Build & Index

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build
        run: node build.js

      - name: Validate chord diagrams
        run: node test-chords.js

      - name: Submit new URLs to IndexNow
        run: node submit-indexnow.js

      - name: Build summary
        run: |
          echo "### Daily Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CHORD_COUNT=$(node -e "console.log(require('./chords/index.json').length)")
          SITEMAP_URLS=$(grep -c "<loc>" sitemap-chords.xml || echo 0)
          echo "- **AI Chord Pages:** ${CHORD_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sitemap Chord URLs:** ${SITEMAP_URLS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if git diff --quiet; then
            echo "- **Status:** No new changes" >> $GITHUB_STEP_SUMMARY
          else
            NEW_PAGES=$(git diff --name-only | grep "^chords/" | grep -c "index.html" || echo 0)
            echo "- **New chord pages:** ${NEW_PAGES}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHORD_COUNT=$(node -e "console.log(require('./chords/index.json').length)")
            git commit -m "chore: daily build — ${CHORD_COUNT} chord pages, sitemaps updated"
            git push
          fi
