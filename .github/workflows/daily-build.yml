name: Daily Build & Index

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-build-and-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build
        env:
          ADSENSE_EMERGENCY_MODE: ${{ vars.ADSENSE_EMERGENCY_MODE || 'off' }}
        run: node build.js

      - name: Validate sitemaps
        run: |
          for f in sitemap*.xml; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing"
              exit 1
            fi
            if ! head -1 "$f" | grep -q '<?xml'; then
              echo "ERROR: $f missing XML declaration"
              exit 1
            fi
          done
          echo "All sitemap files present and well-formed"

      - name: Validate chord diagrams
        run: node test-chords.js

      - name: Submit new URLs to IndexNow
        run: node submit-indexnow.js

      - name: Setup Google service account
        if: env.GOOGLE_INDEXING_KEY != ''
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: echo "$GOOGLE_INDEXING_KEY" > google-indexing-key.json

      - name: Check Google index status
        if: hashFiles('google-indexing-key.json') != ''
        run: node check-google-index.js

      - name: Cleanup service account key
        if: always()
        run: rm -f google-indexing-key.json

      - name: Build summary
        run: |
          echo "### Daily Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CHORD_COUNT=$(node -e "console.log(require('./chords/index.json').length)")
          SITEMAP_URLS=$(grep -c "<loc>" sitemap-chords-new.xml sitemap-chords-recent.xml sitemap-chords-archive.xml 2>/dev/null | awk -F: '{s+=$2}END{print s+0}')
          echo "- **AI Chord Pages:** ${CHORD_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sitemap Chord URLs:** ${SITEMAP_URLS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          NEW_PAGES=$(git ls-files --others --exclude-standard -- 'chords/' | grep -c "index\.html" || true)
          MOD_PAGES=$(git diff --name-only -- chords/ | grep -c "index\.html" || true)
          TOTAL_CHANGED=$((NEW_PAGES + MOD_PAGES))
          if [ "$TOTAL_CHANGED" -eq 0 ] && git diff --quiet; then
            echo "- **Status:** No new changes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **New chord pages:** ${TOTAL_CHANGED}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f index-check-state.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Google Index Spot Check" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node check-google-index.js --summary >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push if changed
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHORD_COUNT=$(node -e "console.log(require('./chords/index.json').length)")
            git commit -m "chore: daily build — ${CHORD_COUNT} chord pages, sitemaps updated"
            git pull --rebase
            git push
          fi

      - name: Verify sitemaps are live after deploy
        if: success()
        run: |
          echo "Waiting 120s for GitHub Pages deployment..."
          sleep 120
          FAILED=0
          for sitemap in sitemap.xml sitemap-pages.xml sitemap-chords-new.xml; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ecoliving-tips.github.io/$sitemap")
            if [ "$STATUS" != "200" ]; then
              echo "WARNING: $sitemap returned HTTP $STATUS"
              FAILED=1
            else
              echo "OK: $sitemap is live (HTTP $STATUS)"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::One or more sitemaps not accessible after deploy"
          fi
