<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5521C6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Full circle background — fills Google's circular favicon frame completely -->
  <circle cx="32" cy="32" r="32" fill="#0F0B1A"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#bgGradient)" stroke-width="4"/>

  <!-- "S" letter stylized as a musical wave -->
  <path d="M38 18 C44 18, 46 22, 42 25 C38 28, 22 28, 22 32 C22 36, 26 40, 38 40 C44 40, 46 44, 42 47 C38 50, 22 50, 22 50"
        stroke="url(#bgGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Musical note accent -->
  <circle cx="46" cy="22" r="3.5" fill="url(#noteGradient)"/>
  <rect x="49" y="12" width="2" height="12" rx="1" fill="url(#noteGradient)"/>
  <path d="M49 12 Q54 11, 54 16" stroke="url(#noteGradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Small cross accent -->
  <g fill="#EC4899" opacity="0.8">
    <rect x="14" y="15" width="2" height="8" rx="1"/>
    <rect x="12" y="18" width="6" height="2" rx="1"/>
  </g>
</svg>
